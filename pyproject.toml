[project]
name = "detect-fake-images"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "tqdm",
    "requests",
    "Pillow",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
gen-local = [
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "sentencepiece",
    "protobuf",
]

[tool.uv]
package = false
